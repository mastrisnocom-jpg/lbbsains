<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webapp Map API Indonesia</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 16px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1557b0;
        }
        /* Elemen Peta */
        #map {
            width: 100%;
            height: 400px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .info-box {
            margin-top: 12px;
            background: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🗺️ Peta Interaktif Indonesia</h1>
        <p style="font-size: 13px; color: #666;">Cari lokasi atau kota di Indonesia menggunakan OpenStreetMap API</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari nama kota/tempat (misal: Surabaya, Monas, Bandung)..." onkeypress="handleKeyPress(event)">
        <button onclick="searchLocation()">Cari Lokasi</button>
    </div>

    <!-- Wadah Peta -->
    <div id="map"></div>

    <div class="info-box" id="infoBox">
        Klik pada peta atau cari lokasi di atas untuk melihat koordinat Latitude & Longitude.
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Koordinat Default (Surabaya, Indonesia)
    let defaultLat = -7.2575;
    let defaultLng = 112.7521;

    // Inisialisasi Peta
    const map = L.map('map').setView([defaultLat, defaultLng], 12);

    // Memuat Tile Layer dari OpenStreetMap (Gratis)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Menambahkan Marker awal
    let marker = L.marker([defaultLat, defaultLng]).addTo(map)
        .bindPopup('Surabaya, Jawa Timur')
        .openPopup();

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchLocation();
    }

    // FUNGSI PENCARIAN LOKASI (API Nominatim Geocoding)
    async function searchLocation() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const infoBox = document.getElementById('infoBox');
        infoBox.innerHTML = 'Mencari koordinat lokasi...';

        try {
            // Memanggil API Geocoding Gratis dari OpenStreetMap
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data && data.length > 0) {
                const lat = parseFloat(data[0].lat);
                const lon = parseFloat(data[0].lon);
                const displayName = data[0].display_name;

                // Geser peta ke lokasi baru
                map.setView([lat, lon], 14);

                // Pindahkan Marker
                marker.setLatLng([lat, lon])
                    .bindPopup(`<b>${data[0].name || query}</b><br>${displayName}`)
                    .openPopup();

                infoBox.innerHTML = `<strong>Lokasi Ditemukan:</strong> ${displayName}<br><strong>Koordinat:</strong> Lat ${lat}, Lng ${lon}`;
            } else {
                infoBox.innerHTML = '<span style="color:red;">Lokasi tidak ditemukan. Coba kata kunci yang lebih spesifik.</span>';
            }
        } catch (err) {
            infoBox.innerHTML = '<span style="color:red;">Gagal terhubung ke API Peta.</span>';
        }
    }

    // Klik langsung pada peta untuk mendapatkan koordinat
    map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(5);
        const lng = e.latlng.lng.toFixed(5);

        marker.setLatLng([lat, lng])
            .bindPopup(`Titik Koordinat:<br>Lat: ${lat}<br>Lng: ${lng}`)
            .openPopup();

        document.getElementById('infoBox').innerHTML = `<strong>Titik Dipilih:</strong> Latitude: ${lat}, Longitude: ${lng}`;
    });
</script>

</body>
</html>
