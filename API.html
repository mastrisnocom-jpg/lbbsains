<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Search API Indonesia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #1a73e8;
            font-size: 24px;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
        }

        /* Search Box */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 12px 20px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1557b0;
        }

        /* Category Chips */
        .category-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 5px;
        }
        .chip {
            background: #e8f0fe;
            color: #1a73e8;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
        }

        /* Cards Grid */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px;
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 16px;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        .card-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 40px 10px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌐 Universal API Search</h1>
        <p class="subtitle">Cari Masakan, Wilayah, Jadwal Sholat, Cuaca & Berita dalam 1 Aplikasi</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ketik kata kunci (misal: Masakan, Surabaya, Sholat, Cuaca)..." onkeypress="handleKeyPress(event)">
        <button onclick="universalSearch()">Cari</button>
    </div>

    <div class="category-chips">
        <span class="chip" onclick="quickSearch('Masakan Ayam')">🍲 Masakan</span>
        <span class="chip" onclick="quickSearch('Surabaya')">🕌 Jadwal Sholat</span>
        <span class="chip" onclick="quickSearch('Jawa Timur')">📍 Wilayah</span>
        <span class="chip" onclick="quickSearch('Cuaca Jakarta')">🌤️ Cuaca</span>
    </div>

    <div class="results-grid" id="resultsGrid">
        <div class="empty-msg">Ketik kata kunci di atas untuk mencari data API.</div>
    </div>
</div>

<script>
    function handleKeyPress(e) {
        if (e.key === 'Enter') universalSearch();
    }

    function quickSearch(keyword) {
        document.getElementById('searchInput').value = keyword;
        universalSearch();
    }

    async function universalSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) return;

        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = '<div class="loading">Memuat data dari API...</div>';

        const lowerQuery = query.toLowerCase();

        // ROUTER PENCARIAN TERINTEGRASI BERDASARKAN KATA KUNCI
        if (lowerQuery.includes('masakan') || lowerQuery.includes('resep') || lowerQuery.includes('ayam') || lowerQuery.includes('soto') || lowerQuery.includes('soup') || lowerQuery.includes('rice')) {
            fetchRecipeAPI(query);
        } else if (lowerQuery.includes('sholat') || lowerQuery.includes('jadwal') || lowerQuery.includes('surabaya') || lowerQuery.includes('jakarta') || lowerQuery.includes('bandung')) {
            fetchSholatAPI(query);
        } else if (lowerQuery.includes('wilayah') || lowerQuery.includes('provinsi') || lowerQuery.includes('jawa') || lowerQuery.includes('sumatra')) {
            fetchWilayahAPI();
        } else {
            // Default Fallback: Cari Resep Masakan
            fetchRecipeAPI(query);
        }
    }

    // 1. INTEGRASI API RESEP MASAKAN (TheMealDB API)
    async function fetchRecipeAPI(query) {
        const grid = document.getElementById('recipeGrid') || document.getElementById('resultsGrid');
        const cleanQuery = query.replace(/masakan|resep/gi, '').trim() || 'chicken';

        try {
            const response = await fetch(`https://www.themealdb.com/api/json/v1/1/search.php?s=${encodeURIComponent(cleanQuery)}`);
            const result = await response.json();

            if (result.meals) {
                let html = '';
                result.meals.forEach(item => {
                    html += `
                        <div class="card">
                            <img src="${item.strMealThumb}" alt="${item.strMeal}">
                            <h3 class="card-title">🍲 ${item.strMeal}</h3>
                            <p class="card-desc"><strong>Kategori:</strong> ${item.strCategory} | <strong>Asal:</strong> ${item.strArea}</p>
                            <p class="card-desc" style="margin-top:8px;"><strong>Cara Masak Singkat:</strong> ${item.strInstructions.substring(0, 120)}...</p>
                        </div>
                    `;
                });
                grid.innerHTML = html;
            } else {
                grid.innerHTML = '<div class="empty-msg">Resep masakan tidak ditemukan.</div>';
            }
        } catch (err) {
            grid.innerHTML = '<div class="empty-msg" style="color:red;">Gagal mengambil data masakan.</div>';
        }
    }

    // 2. INTEGRASI API JADWAL SHOLAT (MyQuran API)
    async function fetchSholatAPI(cityName) {
        const grid = document.getElementById('resultsGrid');
        try {
            // Ambil ID Kota
            const cityRes = await fetch(`https://api.myquran.com/v2/sholat/kota/cari/${encodeURIComponent(cityName)}`);
            const cityData = await cityRes.json();

            if (cityData.status && cityData.data.length > 0) {
                const cityId = cityData.data[0].id;
                const date = new Date();
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');

                // Ambil Jadwal Sholat
                const sholatRes = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${cityId}/${year}/${month}/${day}`);
                const sholatData = await sholatRes.json();
                const j = sholatData.data.jadwal;

                grid.innerHTML = `
                    <div class="card">
                        <h3 class="card-title">🕌 Jadwal Sholat ${sholatData.data.lokasi}</h3>
                        <p class="card-desc"><strong>Tanggal:</strong> ${j.tanggal}</p>
                        <hr style="margin: 10px 0; border: none; border-top: 1px solid #eee;">
                        <p class="card-desc">Subuh: <strong>${j.subuh}</strong> | Dzuhur: <strong>${j.dzuhur}</strong></p>
                        <p class="card-desc">Ashar: <strong>${j.ashar}</strong> | Maghrib: <strong>${j.maghrib}</strong></p>
                        <p class="card-desc">Isya: <strong>${j.isya}</strong></p>
                    </div>
                `;
            } else {
                fetchRecipeAPI(cityName);
            }
        } catch (err) {
            fetchRecipeAPI(cityName);
        }
    }

    // 3. INTEGRASI API WILAYAH INDONESIA (EMS IFA API)
    async function fetchWilayahAPI() {
        const grid = document.getElementById('resultsGrid');
        try {
            const response = await fetch('https://emsifa.github.io/api-wilayah-indonesia/api/provinces.json');
            const provinces = await response.json();

            let html = '<div class="card"><h3 class="card-title">📍 Daftar Provinsi di Indonesia</h3><ul style="padding-left: 20px; font-size:14px; line-height: 1.8;">';
            provinces.slice(0, 10).forEach(p => {
                html += `<li>ID ${p.id}: <strong>${p.name}</strong></li>`;
            });
            html += '</ul></div>';
            grid.innerHTML = html;
        } catch (err) {
            grid.innerHTML = '<div class="empty-msg" style="color:red;">Gagal mengambil data wilayah.</div>';
        }
    }
</script>

</body>
</html>
