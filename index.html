</head>
<body class="flex justify-center min-h-screen text-slate-800">

  <!-- APP CONTAINER -->
  <div id="appContainer" class="w-full max-w-md md:max-w-4xl bg-slate-100 min-h-screen flex flex-col justify-between shadow-2xl relative pb-20">

    <!-- HEADER / TOPBAR -->
    <header id="appHeader" class="bg-brand-600 text-white px-4 pt-5 pb-6 rounded-b-[2rem] shadow-md relative z-20">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center gap-2">
          <button id="btnBack" onclick="navigateView('dashboard')" class="text-white hover:bg-white/20 p-1.5 rounded-full transition hidden">
            <i class="fa-solid fa-arrow-left text-base"></i>
          </button>
          <div class="bg-white text-brand-700 font-extrabold text-xs px-3 py-1 rounded-full shadow flex items-center gap-1.5">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Bimbel SAINS</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <span id="userRoleBadge" class="bg-amber-400 text-brand-950 font-black text-[10px] px-2.5 py-0.5 rounded-full uppercase tracking-wide">
            SUPERADMIN
          </span>
          <button onclick="refreshCurrentView()" class="bg-brand-500 hover:bg-brand-400 text-white text-xs px-3 py-1 rounded-full flex items-center gap-1 font-medium transition shadow-sm">
            <span>Refresh</span>
            <i id="refreshIcon" class="fa-solid fa-rotate text-[10px]"></i>
          </button>
        </div>
      </div>

      <div class="flex justify-between items-end mt-1">
        <div>
          <p class="text-[11px] text-blue-200 font-medium">Status saya</p>
          <h1 id="userDisplayName" class="text-sm font-bold text-white tracking-wide uppercase">ADMINISTRATOR UTAMA</h1>
        </div>
        <button onclick="handleLogout()" class="text-xs bg-red-500/80 hover:bg-red-600 px-2.5 py-1 rounded-lg transition text-white flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main id="mainContent" class="px-4 -mt-3 z-10 flex-1 space-y-4">
      <!-- Dynamic Views Rendered via JavaScript -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto bg-white border-t border-slate-200 px-4 py-2 flex justify-between items-center z-50 rounded-t-2xl shadow-lg">
      <div class="bg-slate-800 text-white text-[11px] rounded-full px-2.5 py-1 flex items-center gap-1.5 font-bold shadow">
        <i class="fa-regular fa-eye"></i>
        <span id="visitorCounter">0</span>
      </div>

      <button onclick="navigateView('presensi')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-regular fa-calendar-check text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Presensi</span>
      </button>

      <div class="-mt-6">
        <button onclick="navigateView('semua_menu')" class="w-12 h-12 rounded-full bg-brand-600 border-4 border-slate-100 text-white flex items-center justify-center text-lg shadow-lg hover:bg-brand-700 transition">
          <i class="fa-solid fa-grip"></i>
        </button>
      </div>

      <button onclick="navigateView('laporan')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-solid fa-file-invoice text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Laporan</span>
      </button>

      <button onclick="navigateView('profil')" class="flex flex-col items-center text-slate-500 hover:text-brand-600 transition">
        <i class="fa-regular fa-user text-base"></i>
        <span class="text-[9px] font-semibold mt-0.5">Profil</span>
      </button>
    </nav>

  </div>

  <!-- MODAL CONTAINER -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div id="modalCard" class="bg-white rounded-2xl w-full max-w-md p-5 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
      <!-- Modal Content Dynamic -->
    </div>
  </div>

  <!-- JAVASCRIPT & SUPABASE INTEGRATION -->
  <script>
    const SUPABASE_URL = 'https://dbfzscedfnonjllwvhaw.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRiZnpzY2VkZm5vbmpsbHd2aGF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzcyNTgsImV4cCI6MjEwMTc1MzI1OH0.1KrE5HAlk_cvTsGn_xIF2d9f24pUqBGr_87srvm4HD4';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;
    let userRole = 'SUPERADMIN';
    let currentView = 'dashboard';

    document.addEventListener('DOMContentLoaded', async () => {
      await recordVisitorReal();
      await fetchVisitorCountReal();
      await checkAuthSession();
    });

    async function checkAuthSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        currentUser = session.user;
        await fetchUserProfile();
        renderHeaderUserInfo();
        navigateView('dashboard');
      } else {
        renderLoginView();
      }
    }

    async function fetchUserProfile() {
      if (!currentUser) return;
      const { data } = await sb.from('profiles').select('role, nama_lengkap').eq('id', currentUser.id).single();
      if (data) {
        userRole = data.role || 'SUPERADMIN';
        currentUser.nama_lengkap = data.nama_lengkap;
      }
    }

    async function recordVisitorReal() {
      try { await sb.from('visitors').insert([{}]); } catch (e) {}
    }

    async function fetchVisitorCountReal() {
      try {
        const { count } = await sb.from('visitors').select('*', { count: 'exact', head: true });
        if (count !== null) document.getElementById('visitorCounter').innerText = count;
      } catch (e) {}
    }

    function renderHeaderUserInfo() {
      if (currentUser) {
        const displayName = currentUser.nama_lengkap || currentUser.email.split('@')[0];
        document.getElementById('userDisplayName').innerText = displayName;
        document.getElementById('userRoleBadge').innerText = userRole;
      }
    }

    function renderLoginView() {
      document.getElementById('appHeader').classList.add('hidden');
      document.getElementById('bottomNav').classList.add('hidden');

      const main = document.getElementById('mainContent');
      main.classList.remove('-mt-3');
      main.classList.add('pt-10');

      main.innerHTML = `
        <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 max-w-sm mx-auto my-auto space-y-5">
          <div class="text-center space-y-1">
            <div class="w-16 h-16 bg-brand-600 text-white rounded-2xl flex items-center justify-center text-3xl mx-auto shadow-md">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-xl font-black text-slate-800 pt-2">BIMBEL SAINS</h1>
            <p id="authSubtitle" class="text-xs font-semibold text-slate-400">Management System Login</p>
          </div>

          <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-3 text-xs">
            <div>
              <label class="font-bold text-slate-700">Email / Username</label>
              <input type="email" id="loginEmail" required placeholder="email@bimbelsains.com" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="font-bold text-slate-700">Password</label>
              <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <button type="submit" id="btnLoginSubmit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 rounded-xl shadow-md transition text-xs mt-2">
              Login ke Sistem
            </button>
            <div class="text-center pt-2 text-[11px] text-slate-500">
              Belum punya akun? <a href="#" onclick="toggleAuthForm('register')" class="text-brand-600 font-bold underline">Daftar Akun Baru</a>
            </div>
          </form>

          <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3 text-xs hidden">
            <div>
              <label class="font-bold text-slate-700">Nama Lengkap</label>
              <input type="text" id="regNama" required placeholder="Nama Lengkap" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="font-bold text-slate-700">Email</label>
              <input type="email" id="regEmail" required placeholder="email@bimbelsains.com" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="font-bold text-slate-700">Password</label>
              <input type="password" id="regPassword" required minlength="6" placeholder="Minimal 6 Karakter" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none">
            </div>
            <div>
              <label class="font-bold text-slate-700">Daftar Sebagai</label>
              <select id="regRole" class="w-full border border-slate-200 p-3 rounded-xl mt-1 focus:ring-2 focus:ring-brand-500 outline-none bg-white">
                <option value="SISWA">Siswa</option>
                <option value="GURU">Guru</option>
                <option value="STAFF ADMIN">Staff Admin</option>
                <option value="ORANG TUA">Orang Tua</option>
              </select>
            </div>
            <button type="submit" id="btnRegSubmit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition text-xs mt-2">
              Daftar Sekarang
            </button>
            <div class="text-center pt-2 text-[11px] text-slate-500">
              Sudah punya akun? <a href="#" onclick="toggleAuthForm('login')" class="text-brand-600 font-bold underline">Login Kembali</a>
            </div>
          </form>
        </div>
      `;
    }

    function toggleAuthForm(mode) {
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const subtitle = document.getElementById('authSubtitle');

      if (mode === 'register') {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        subtitle.innerText = "Pendaftaran Akun Baru";
      } else {
        formRegister.classList.add('hidden');
        formLogin.classList.remove('hidden');
        subtitle.innerText = "Management System Login";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.innerText = 'Memproses...';
      btn.disabled = true;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        alert('Login Gagal: ' + error.message);
        btn.innerText = 'Login ke Sistem';
        btn.disabled = false;
      } else {
        currentUser = data.user;
        await fetchUserProfile();
        document.getElementById('appHeader').classList.remove('hidden');
        document.getElementById('bottomNav').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('-mt-3');
        document.getElementById('mainContent').classList.remove('pt-10');
        renderHeaderUserInfo();
        navigateView('dashboard');
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const nama = document.getElementById('regNama').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      const btn = document.getElementById('btnRegSubmit');

      btn.innerText = 'Memproses Pendaftaran...';
      btn.disabled = true;

      const { data, error } = await sb.auth.signUp({ email, password });

      if (error) {
        alert('Registrasi Gagal: ' + error.message);
        btn.innerText = 'Daftar Sekarang';
        btn.disabled = false;
        return;
      }

      if (data.user) {
        await sb.from('profiles').upsert([{
          id: data.user.id,
          nama_lengkap: nama,
          email: email,
          role: role,
          status_aktif: true
        }]);

        alert('Pendaftaran Berhasil! Silakan Login.');
        toggleAuthForm('login');
        document.getElementById('loginEmail').value = email;
      }

      btn.innerText = 'Daftar Sekarang';
      btn.disabled = false;
    }

    async function handleLogout() {
      if (confirm('Keluar dari aplikasi?')) {
        await sb.auth.signOut();
        currentUser = null;
        renderLoginView();
      }
    }

    // ROUTER NAVIGATION
    function navigateView(viewName) {
      currentView = viewName;
      const main = document.getElementById('mainContent');
      const btnBack = document.getElementById('btnBack');

      if (viewName === 'dashboard') {
        btnBack.classList.add('hidden');
      } else {
        btnBack.classList.remove('hidden');
      }

      switch (viewName) {
        case 'dashboard': renderDashboard(main); break;
        case 'management_panel': renderManagementPanel(main); break;
        case 'semua_menu': renderSemuaMenu(main); break;
        case 'kelola_user': renderKelolaUser(main); break;
        case 'kelola_siswa': renderKelolaSiswa(main); break;
        case 'kelola_kelas': renderKelolaKelas(main); break;
        case 'jadwal': renderJadwal(main); break;
        case 'presensi': renderPresensi(main); break;
        case 'keuangan': renderKeuangan(main); break;
        case 'laporan': renderLaporan(main); break;
        case 'nilai': renderNilai(main); break;
        case 'broadcast': renderBroadcast(main); break;
        case 'setting_web': renderSettingWeb(main); break;
        case 'database': renderDatabase(main); break;
        case 'profil': renderProfil(main); break;
        case 'soal_guru': renderSoalGuru(main); break;
        case 'soal_siswa': renderSoalSiswa(main); break;
        default: renderDashboard(main);
      }
    }

    function refreshCurrentView() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      setTimeout(() => {
        navigateView(currentView);
        fetchVisitorCountReal();
        refreshIcon.classList.remove('fa-spin');
      }, 500);
    }

    // DASHBOARD UTAMA
    async function renderDashboard(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <h2 class="text-base font-bold text-slate-800 mb-0.5">Panel Kendali Pusat Bimbel</h2>
          <p class="text-xs font-semibold text-slate-500">
            Total Murid: <span id="dashMurid" class="text-slate-800 font-bold">...</span> | 
            Total Guru: <span id="dashGuru" class="text-slate-800 font-bold">...</span>
          </p>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <i class="fa-solid fa-house text-brand-600 text-sm"></i>
              <h3 class="text-xs font-bold text-brand-900">Ringkasan Keuangan & Operasional</h3>
            </div>
            <span class="bg-slate-900 text-white text-[9px] font-bold px-2 py-0.5 rounded uppercase">AKSES FULL</span>
          </div>
          <p class="text-[11px] text-slate-500 mb-3">Sistem terintegrasi secara real-time dengan Supabase.</p>
          <button onclick="navigateView('management_panel')" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow-md transition">
            Buka Management Panel
          </button>
        </div>

        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
          <div class="grid grid-cols-4 gap-y-4 gap-x-2 text-center">
            
            <div onclick="navigateView('soal_siswa')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-indigo-600 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-pen-to-square"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Latihan Soal</span>
            </div>

            <div onclick="navigateView('soal_guru')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-teal-600 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-book-bookmark"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Bank Soal Guru</span>
            </div>

            <div onclick="navigateView('kelola_user')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-red-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-users-gear"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Kelola User</span>

            <div onclick="navigateView('keuangan')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-chart-pie"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Keuangan</span>
            </div>

            <div onclick="navigateView('kelola_kelas')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-brand-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-laptop"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Kelola Kelas</span>
            </div>

            <div onclick="navigateView('laporan')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-emerald-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-file-invoice"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Laporan Full</span>
            </div>

            <div onclick="navigateView('broadcast')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-pink-500 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-bullhorn"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Broadcast</span>
            </div>

            <div onclick="navigateView('semua_menu')" class="flex flex-col items-center cursor-pointer group">
              <div class="w-11 h-11 rounded-full bg-brand-600 text-white flex items-center justify-center text-lg shadow-md group-hover:scale-105 transition">
                <i class="fa-solid fa-table-cells"></i>
              </div>
              <span class="text-[10px] font-bold text-slate-700 mt-1.5">Semua Menu</span>

          </div>
        </div>
      `;

      const { count: countMurid } = await sb.from('students').select('*', { count: 'exact', head: true });
      const { count: countGuru } = await sb.from('teachers').select('*', { count: 'exact', head: true });

      document.getElementById('dashMurid').innerText = countMurid !== null ? countMurid : 0;

    }

    // ==========================================
    // MODUL BARU: INPUT BANK SOAL KHUSUS GURU
    // ==========================================
    async function renderSoalGuru(container) {
      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3">
          <div class="flex justify-between items-center">
            <h2 class="text-base font-bold text-slate-800">Bank Soal & Kunci Jawaban (Guru)</h2>
            <button onclick="openModalTambahSoal()" class="bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition">+ Buat Soal</button>
          </div>
          <p class="text-[11px] text-slate-500">Guru menentukan pertanyaan, opsi pilihan, dan kunci jawaban yang tersembunyi dari murid.</p>

          <div id="quizGuruListContainer" class="space-y-2 text-xs pt-2">
            <p class="text-slate-400 italic">Memuat bank soal...</p>
          </div>
        </div>
      `;

      const { data: quizzes } = await sb.from('quizzes').select('*').order('created_at', { ascending: false });
      const listContainer = document.getElementById('quizGuruListContainer');

      if (!quizzes || quizzes.length === 0) {
        listContainer.innerHTML = `<p class="text-slate-400 py-3 text-center">Belum ada kuis atau soal yang dibuat.</p>`;
        return;
      }

      listContainer.innerHTML = quizzes.map((q, idx) => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
          <div class="flex justify-between items-start">
            <span class="bg-teal-100 text-teal-800 font-bold text-[9px] px-2 py-0.5 rounded">${q.mata_pelajaran || 'Umum'}</span>
            <span class="bg-emerald-100 text-emerald-800 font-bold text-[10px] px-2 py-0.5 rounded">Kunci: ${q.kunci_jawaban}</span>
          </div>
          <p class="font-bold text-slate-800 text-xs">${idx + 1}. ${q.pertanyaan}</p>
          <div class="grid grid-cols-2 gap-1 text-[10px] text-slate-600 pt-1">

    async function saveSoalReal(e) {
      e.preventDefault();
      const mata_pelajaran = document.getElementById('qMapel').value;

      const pilihan_b = document.getElementById('qB').value;
      const pilihan_c = document.getElementById('qC').value;
      const pilihan_d = document.getElementById('qD').value;
      const kunci_jawaban = document.getElementById('qKunci').value;

      const { error } = await sb.from('quizzes').insert([{
        judul: 'Kuis Interaktif', mata_pelajaran, pertanyaan, pilihan_a, pilihan_b, pilihan_c, pilihan_d, kunci_jawaban
      }]);

      if (error) alert('Gagal menyimpan soal: ' + error.message);
      else { closeModal(); renderSoalGuru(document.getElementById('mainContent')); }

    async function submitJawabanSiswa(e) {
      e.preventDefault();
      const form = e.target;
      const { data: quizzes } = await sb.from('quizzes').select('*');

      let jumlahBenar = 0;
      let totalSoal = quizzes.length;

      quizzes.forEach(q => {
        const selected = form[`q_${q.id}`]?.value;
        if (selected === q.kunci_jawaban) {
          jumlahBenar++;
        }
      });

      const nilaiAkhir = Math.round((jumlahBenar / totalSoal) * 100);

      alert(`Hasil Latihan Soal Anda:\n\nBenar: ${jumlahBenar} dari ${totalSoal} Soal\nNilai Akhir: ${nilaiAkhir}/100`);
    }

    async function catatPresensi(status) {
      const namaUser = currentUser ? (currentUser.nama_lengkap || currentUser.email) : 'MASTRISNO';
      const roleUser = userRole || 'GURU';

      const now = new Date();
      const jam = String(now.getHours()).padStart(2, '0');
      const menit = String(now.getMinutes()).padStart(2, '0');
      const detik = String(now.getSeconds()).padStart(2, '0');
      const waktuFormatted = `${jam}:${menit}:${detik}`;

      const payload = {
        nama: namaUser,
        role: roleUser,
        status: status,
        tanggal: now.toISOString().split('T')[0],
        waktu: waktuFormatted
      };

      const { error } = await sb.from('attendance').insert([payload]);

      if (error) {
        alert('Gagal mencatat presensi: ' + error.message);
      } else {
        alert(`Presensi status '${status}' berhasil dicatat!`);
        fetchRiwayatPresensi();
      }
    }

    async function fetchRiwayatPresensi() {
      const container = document.getElementById('presensiListContainer');
      if (!container) return;

      const { data: logs, error } = await sb.from('attendance').select('*').order('created_at', { ascending: false });

      if (error || !logs || logs.length === 0) {
        container.innerHTML = `<p class="text-slate-400 py-3 text-center">Belum ada riwayat presensi.</p>`;
        return;
      }

      container.innerHTML = logs.map(item => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 flex justify-between items-center">
          <div>
            <p class="font-bold text-slate-800">${item.nama || 'User'} <span class="text-[10px] text-slate-400 font-normal">(${item.role || 'GURU'})</span></p>
            <p class="text-[10px] text-slate-500"><i class="fa-regular fa-clock"></i> ${item.tanggal || '-'} • ${item.waktu || '-'}</p>
          </div>
          <span class="${item.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} text-[10px] font-bold px-2.5 py-0.5 rounded-full">
            ${item.status}
          </span>
        </div>
      `).join('');
    }

    async function exportAbsenPDF() {
      const { data: logs } = await sb.from('attendance').select('*').order('created_at', { ascending: false });
      if (!logs || logs.length === 0) return alert('Data presensi kosong.');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text('LAPORAN PRESENSI BIMBEL SAINS', 14, 15);

      const tableData = logs.map((item, index) => [index + 1, item.nama || '-', item.role || '-', item.status || '-', item.tanggal || '-', item.waktu || '-']);
      doc.autoTable({ startY: 20, head: [['No', 'Nama', 'Role', 'Status', 'Tanggal', 'Waktu']], body: tableData });
      doc.save('Laporan_Presensi.pdf');
    }

    async function exportAbsenExcel() {
      const { data: logs } = await sb.from('attendance').select('*').order('created_at', { ascending: false });
      if (!logs || logs.length === 0) return alert('Data presensi kosong.');

      const formattedData = logs.map((item, index) => ({ 'No': index + 1, 'Nama': item.nama || '-', 'Role': item.role || '-', 'Status': item.status || '-', 'Tanggal': item.tanggal || '-', 'Waktu': item.waktu || '-' }));
      const worksheet = XLSX.utils.json_to_sheet(formattedData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Presensi');
      XLSX.writeFile(workbook, 'Laporan_Presensi.xlsx');
    }
