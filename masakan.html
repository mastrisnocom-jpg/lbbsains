<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Kuliner Nusantara (Lokal)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 16px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            color: #d9534f;
            font-size: 24px;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #666;
            font-size: 14px;
        }
        
        /* Bar Pencarian */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #d9534f;
        }
        button {
            padding: 12px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #c9302c;
        }

        /* Riwayat Pencarian */
        .history-container {
            margin-bottom: 20px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .history-title {
            font-size: 13px;
            color: #666;
        }
        .btn-clear {
            font-size: 12px;
            color: #d9534f;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            font-weight: normal;
        }
        .btn-clear:hover {
            text-decoration: underline;
            background: none;
        }
        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag {
            background: #e9ecef;
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            color: #495057;
            transition: background 0.2s;
        }
        .tag:hover {
            background: #dee2e6;
        }

        /* Kartu Resep */
        .recipe-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-body {
            padding: 14px;
        }
        .card-title {
            font-size: 16px;
            margin-bottom: 6px;
            color: #2c3e50;
        }
        .card-desc {
            font-size: 13px;
            color: #666;
        }

        .loading, .empty-msg {
            text-align: center;
            padding: 30px 10px;
            color: #777;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍲 Resep Kuliner Nusantara</h1>
        <p class="subtitle">Cari resep masakan khas Indonesia pilihanmu</p>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Soto ayam, Rendang, Ayam..." onkeypress="handleKeyPress(event)">
        <button onclick="searchRecipe()">Cari</button>
    </div>

    <div class="history-container">
        <div class="history-header">
            <span class="history-title">Riwayat Pencarian Lokal:</span>
            <button class="btn-clear" onclick="clearHistory()">Hapus Riwayat</button>
        </div>
        <div class="history-tags" id="historyTags"></div>
    </div>

    <div class="recipe-grid" id="recipeGrid">
        <div class="empty-msg">Ketik nama masakan di atas untuk mencari resep.</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadHistory();
    });

    function handleKeyPress(e) {
        if (e.key === 'Enter') searchRecipe();
    }

    // Cari Resep dari API
    async function searchRecipe(queryOverride) {
        const inputElement = document.getElementById('searchInput');
        const query = queryOverride || inputElement.value.trim();

        if (!query) return;

        if (!queryOverride) {
            saveHistory(query);
        }

        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = '<div class="loading">Mencari resep masakan...</div>';

        // Memakai proxy AllOrigins agar bebas masalah CORS
        const targetUrl = 'https://masak-apa-tommorow.vercel.app/api/search/?q=' + encodeURIComponent(query);
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Network error');
            
            const result = await response.json();

            if (result.status && result.results && result.results.length > 0) {
                renderRecipes(result.results);
            } else {
                grid.innerHTML = '<div class="empty-msg">Resep tidak ditemukan. Coba kata kunci masakan lain.</div>';
            }
        } catch (error) {
            grid.innerHTML = '<div class="empty-msg" style="color:#d9534f;">Gagal mengambil data resep.<br>Periksa koneksi internet Anda.</div>';
        }
    }

    function renderRecipes(recipes) {
        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = '';

        recipes.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.thumb || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${item.title}" onerror="this.src='https://via.placeholder.com/300x180?text=Gambar+Tidak+Tersedia'">
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">Waktu: ${item.times || '-'} | Porsi: ${item.portion || '-'}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // --- FITUR MANAJEMEN RIWAYAT LOKAL (localStorage) ---

    function saveHistory(query) {
        let history = JSON.parse(localStorage.getItem('recipeHistoryLocal')) || [];
        
        // Hapus duplikat
        history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
        
        // Tambahkan ke urutan paling depan
        history.unshift(query);
        
        // Batasi maksimal 8 riwayat
        if (history.length > 8) history.pop();

        localStorage.setItem('recipeHistoryLocal', JSON.stringify(history));
        loadHistory();
    }

    function loadHistory() {
        const historyContainer = document.getElementById('historyTags');
        const history = JSON.parse(localStorage.getItem('recipeHistoryLocal')) || [];

        historyContainer.innerHTML = '';

        if (history.length === 0) {
            historyContainer.innerHTML = '<span style="font-size: 12px; color: #aaa;">Belum ada riwayat.</span>';
            return;
        }

        history.forEach(keyword => {
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = keyword;
            tag.onclick = () => {
                document.getElementById('searchInput').value = keyword;
                searchRecipe(keyword);
            };
            historyContainer.appendChild(tag);
        });
    }

    function clearHistory() {
        localStorage.removeItem('recipeHistoryLocal');
        loadHistory();
    }
</script>

</body>
</html>
