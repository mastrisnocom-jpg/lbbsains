<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resep Nusantara - Jelajah Kuliner Indonesia</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        h1 {
            color: #d9534f;
            margin-bottom: 8px;
        }
        
        /* Form Pencarian */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            padding: 12px 20px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #c9302c;
        }

        /* Section Riwayat Pencarian */
        .history-container {
            margin-bottom: 25px;
        }
        .history-title {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        .history-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tag:hover {
            background: #d6d8db;
        }

        /* Layout Kartu Resep */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .card-body {
            padding: 15px;
        }
        .card-title {
            font-size: 18px;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .card-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* Detail Modal / View */
        .loading, .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🍲 Resep Kuliner Nusantara</h1>
        <p>Cari resep masakan khas Indonesia pilihanmu</p>
    </header>

    <!-- Bar Pencarian -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari resep (contoh: Rendang, Soto, Ayam)..." onkeypress="handleKeyPress(event)">
        <button onclick="searchRecipe()">Cari</button>
    </div>

    <!-- Riwayat Pencarian -->
    <div class="history-container">
        <div class="history-title">Riwayat Pencarian Anda:</div>
        <div class="history-tags" id="historyTags">
            <!-- Riwayat akan dimasukkan via JavaScript -->
        </div>
    </div>

    <!-- Daftar Resep -->
    <div class="recipe-grid" id="recipeGrid">
        <div class="empty-msg">Ketik nama masakan di atas untuk menampilkan resep.</div>
    </div>
</div>

<script>
    // API Public Resep Indonesia (Unofficial)
    const API_BASE_URL = 'https://masak-apa-tommorow.vercel.app/api/search/?q=';

    // Inisialisasi saat aplikasi pertama dimuat
    document.addEventListener('DOMContentLoaded', () => {
        renderHistory();
    });

    // Jalankan pencarian jika menekan Enter
    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            searchRecipe();
        }
    }

    // Fungsi Utama Mencari Resep
    async function searchRecipe(queryOverride) {
        const inputElement = document.getElementById('searchInput');
        const query = queryOverride || inputElement.value.trim();

        if (!query) return;

        if (!queryOverride) {
            saveToHistory(query);
            renderHistory();
        }

        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = '<div class="loading">Sabar ya, sedang mengambil data resep...</div>';

        try {
            const response = await fetch(`${API_BASE_URL}${encodeURIComponent(query)}`);
            const result = await response.json();

            if (result.status && result.results.length > 0) {
                renderRecipes(result.results);
            } else {
                grid.innerHTML = '<div class="empty-msg">Resep tidak ditemukan. Coba kata kunci masakan lain.</div>';
            }
        } catch (error) {
            grid.innerHTML = '<div class="empty-msg" style="color:red;">Gagal mengambil data. Periksa koneksi internet Anda.</div>';
        }
    }

    // Menampilkan Resep ke Tampilan Kartu
    function renderRecipes(recipes) {
        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = '';

        recipes.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${item.thumb || 'https://via.placeholder.com/300x180?text=No+Image'}" alt="${item.title}">
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">Waktu: ${item.times || '-'} | Porsi: ${item.portion || '-'}</p>
                    <p style="font-size: 12px; color: #888;">Tingkat: ${item.dificulty || '-'}</p>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // Menyimpan Kata Kunci ke LocalStorage
    function saveToHistory(query) {
        let history = JSON.parse(localStorage.getItem('recipeHistory')) || [];
        
        // Hapus duplikat jika kata kunci sudah ada
        history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
        
        // Tambah ke urutan paling awal
        history.unshift(query);
        
        // Batasi maksimal 8 riwayat terakhir
        if (history.length > 8) history.pop();

        localStorage.setItem('recipeHistory', JSON.stringify(history));
    }

    // Menampilkan Tag Riwayat
    function renderHistory() {
        const historyContainer = document.getElementById('historyTags');
        const history = JSON.parse(localStorage.getItem('recipeHistory')) || [];

        if (history.length === 0) {
            historyContainer.innerHTML = '<span style="font-size: 13px; color: #aaa;">Belum ada riwayat.</span>';
            return;
        }

        historyContainer.innerHTML = '';
        history.forEach(item => {
            const tag = document.createElement('span');
            tag.className = 'tag';
            tag.textContent = item;
            tag.onclick = () => {
                document.getElementById('searchInput').value = item;
                searchRecipe(item);
            };
            historyContainer.appendChild(tag);
        });
    }
</script>

</body>
</html>
